[package]
name = "botmark"
version = "0.1.1"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
# Logging
log = "0.4"
simple_logger = "5.1.0"

# CLI
clap = { version = "4.5.56", features = ["derive"] }

# Async runtime
tokio = { version = "1.49.0", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "time"] }

# Web dashboard (Render keep-alive)
tiny_http = "0.12"

# Pumpkin protocol stack (latest dev branch)
pumpkin-protocol = { git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-protocol", default-features = false, features = ["serverbound", "clientbound"] }
pumpkin-util     = { git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-util" }
pumpkin-data     = { git = "https://github.com/Pumpkin-MC/Pumpkin", package = "pumpkin-data" }

# Utils
crossbeam = "0.8.4"
uuid = "1.20.0"

# Rand (use crates.io version, not GitHub)
rand = "0.8.5"

# Missing dependency required by your dashboard
urlencoding = "2.1.3"
